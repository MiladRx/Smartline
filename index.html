<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>Smartline Bulb</title>
<style>
  :root{
    --bg:#07090d; --glass:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
    --tx:#f2f5fa; --muted:#9aa3b5; --ok:#5fe3a6; --warn:#ffc857; --err:#ff7b7b;
    --glowC:255,170,90; --glowO:.35; --radius:30px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;min-height:100dvh;color:var(--tx);
    background:
      radial-gradient(110% 60% at 50% -10%, #141a27 0%, var(--bg) 55%),
      var(--bg);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:calc(20px + env(safe-area-inset-top)) 18px calc(26px + env(safe-area-inset-bottom));
  }
  body::before{
    content:"";position:fixed;inset:-25%;pointer-events:none;z-index:0;
    background:radial-gradient(55% 38% at 50% 4%, rgba(var(--glowC), var(--glowO)) 0%, transparent 70%);
    transition:background .5s ease;
  }
  .app{width:100%;max-width:430px;position:relative;z-index:1}
  .top{display:flex;align-items:flex-end;justify-content:space-between;margin:0 8px 18px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted)}
  h1{font-size:23px;font-weight:750;letter-spacing:-.3px;margin:3px 0 0}
  h1 span{color:var(--muted);font-weight:450}
  .top-actions{display:flex;gap:8px;align-items:center}
  .status{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:rgba(0,0,0,.35)}
  .status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
  .status.ok{color:var(--tx)}
  .status.ok i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .status.warn i{background:var(--warn)}
  .status.err{color:#ffc4c4}
  .status.err i{background:var(--err)}
  .lamp{display:block;background:none;border:none;cursor:pointer;color:#5b6474;
    padding:6px;margin:0 auto 2px;transition:transform .15s ease;outline:none}
  .lamp:active{transform:scale(.94)}
  .lamp svg{width:150px;height:150px;transition:color .3s ease, filter .3s ease}
  .lamp:disabled{opacity:.4;cursor:default}
  .lamp.on{color:rgb(var(--glowC))}
  .lamp.on svg{filter:drop-shadow(0 0 30px rgba(var(--glowC), .85))}
  .state{margin-top:10px;font-size:14.5px;color:var(--muted);letter-spacing:.2px;text-align:center}
  .state strong{color:var(--tx);font-weight:650}
  .ctl{margin-top:30px}
  .ctl-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .ctl-name{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted)}
  .chip{min-width:58px;text-align:center;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--tx);
    background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer;--p:50%}
  input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;
    background:linear-gradient(90deg, rgba(var(--glowC),.95) var(--p), rgba(255,255,255,.10) var(--p))}
  input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:rgba(255,255,255,.10)}
  input[type=range]::-moz-range-progress{height:10px;border-radius:99px;background:rgba(var(--glowC),.95)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
    background:#fff;border:none;margin-top:-10px;box-shadow:0 4px 16px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.05);
    transition:transform .12s}
  input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#fff;border:none;
    box-shadow:0 4px 16px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.05)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
  input[type=range]:disabled{opacity:.35;cursor:default}
  #tone::-webkit-slider-runnable-track{background:linear-gradient(90deg,#ff9d4d,var(--p),#ffe9c9 45%,#cfe6ff)}
  #tone::-moz-range-track{background:linear-gradient(90deg,#ff9d4d,#ffe9c9 45%,#cfe6ff)}
  .btn{margin-top:20px;width:100%;padding:16px;border-radius:18px;border:none;cursor:pointer;
    font:inherit;font-weight:700;font-size:15.5px;color:#231603;
    background:linear-gradient(135deg,#ffd9a4,rgb(var(--glowC)));box-shadow:0 12px 30px rgba(var(--glowC),.25)}
  .btn[hidden]{display:none}
  .bridge-row{display:flex;gap:8px;margin-top:14px}
  .bridge-row[hidden]{display:none}
  .bridge-row input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--tx);
    border-radius:14px;padding:13px;font:inherit;font-size:13px}
  .bridge-row input.pin{max-width:92px;text-align:center}
  .bridge-row button{padding:0 18px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);
    color:var(--tx);font:inherit;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
  footer{margin:34px 8px 0;font-size:11.5px;color:#5f6a7e;text-align:center;letter-spacing:.3px}
  .linklike{background:none;border:none;padding:0;color:#5f6a7e;font:inherit;font-size:11.5px;
    letter-spacing:.3px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .linklike:hover{color:var(--tx)}
  @media (max-width:380px){
    .lamp{width:148px;height:148px}
    .lamp svg{width:52px;height:52px}
    h1{font-size:20px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow">Smartline Flow</div>
      <h1>The Mood Changer</h1>
    </div>
    <div class="status" id="status"><i></i><span id="statusText">starting…</span></div>
  </header>

  <button class="lamp" id="power" disabled aria-label="Power">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.3 2.2h4.6c.2-.9.6-1.6 1.3-2.2A6 6 0 0 0 12 3z"/>
      <path d="M9.5 18.5h5"/>
      <path d="M10.5 21h3"/>
    </svg>
  </button>
  <div class="state" id="stateText">—</div>

  <div class="ctl">
    <div class="ctl-head"><span class="ctl-name">Brightness</span><span class="chip" id="brightVal">100%</span></div>
    <input type="range" id="brightness" min="1" max="100" value="100" disabled>
  </div>
  <div class="ctl">
    <div class="ctl-head"><span class="ctl-name">Warmth</span><span class="chip" id="toneVal">50</span></div>
    <input type="range" id="tone" min="0" max="100" value="50" disabled>
  </div>
  <button class="btn" id="connectBtn" hidden>Connect</button>
  <div class="bridge-row" id="bridgeRow" hidden>
    <input type="text" id="bridgeInput" placeholder="Bridge URL (optional)">
    <input type="text" id="pinInput" class="pin" inputmode="numeric" placeholder="PIN">
    <button id="bridgeSave">Save</button>
  </div>

  <footer>Local Bluetooth · no cloud · <button class="linklike" id="gearBtn">settings</button></footer>
</div>

<script>
"use strict";

const UUID = {
  service: "00010203-0405-0607-0809-0a0b0c0d1910",
  status:  "00010203-0405-0607-0809-0a0b0c0d1911",
  command: "00010203-0405-0607-0809-0a0b0c0d1912",
  pair:    "00010203-0405-0607-0809-0a0b0c0d1914",
  fe07:    "0000fe07-0000-1000-8000-00805f9b34fb"
};
const OP = { POWER:0xD0, BRIGHT:0xD2, TONE:0xE2 };
const BRIDGE_URL = "http://" + location.hostname + ":8138";
const MAC = "A4:C1:38:36:D0:B2";
const NAME = "BLE MESH";
const PASS = "123";
const VENDOR = [0x11, 0x02];
const DEST = 0x00B2;
const PREFS_KEY = "smartline-prefs";
const BRIDGE_KEY = "smartline-bridge-url";
const PIN_KEY = "smartline-pin";

let mode = null;
let ready = false;
let device = null;
let chars = {};
let sessionKey = null;
let macBytes = null;
let seq = 0;
let state = { on:false, brightness:100, tone:50 };
let bridgeTimer = null;
let bridgeBase = null;
let relayWs = null;
let relaySeq = 0;
const pendingRelay = {};

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const enc = s => new TextEncoder().encode(s);
const hex = u8 => Array.from(u8, b => b.toString(16).padStart(2,"0")).join("");
const concat = (...arrs) => { const n = arrs.reduce((s,a)=>s+a.length,0); const o = new Uint8Array(n); let p=0; for(const a of arrs){o.set(a,p);p+=a.length;} return o; };
const reverseBytes = u8 => Uint8Array.from(u8).reverse();
const pad16 = u8 => { const o = new Uint8Array(16); o.set(u8.slice(0,16)); return o; };
const xorBytes = (a,b) => { const o = new Uint8Array(a.length); for(let i=0;i<a.length;i++) o[i]=a[i]^b[i]; return o; };
const u24le = n => Uint8Array.of(n & 0xff, (n>>8) & 0xff, (n>>16) & 0xff);

async function aesBlock(key16, block16){
  const ck = await crypto.subtle.importKey("raw", reverseBytes(key16), { name:"AES-CBC" }, false, ["encrypt"]);
  const out = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-CBC", iv:new Uint8Array(16) }, ck, reverseBytes(block16)));
  return reverseBytes(out.slice(0,16));
}
const xorNamePass = (name, pass) => xorBytes(pad16(enc(name)), pad16(enc(pass)));
async function buildPairPacket(name, pass, clientRandom){
  const proof = await aesBlock(pad16(clientRandom), xorNamePass(name, pass));
  return concat(Uint8Array.of(0x0C), clientRandom, proof.slice(0,8));
}
const deriveSessionKey = (name, pass, cr, dr) => aesBlock(xorNamePass(name, pass), concat(cr, dr));
async function makeChecksum(key, nonce8, payload){
  let check = await aesBlock(key, pad16(concat(nonce8, Uint8Array.of(payload.length & 0xff))));
  for(let i=0;i<payload.length;i+=16) check = await aesBlock(key, xorBytes(check, pad16(payload.slice(i,i+16))));
  return check;
}
async function cryptPayload(key, nonce8, payload){
  const base = pad16(concat(Uint8Array.of(0), nonce8));
  const out = new Uint8Array(payload.length);
  for(let i=0;i<payload.length;i+=16){
    const ks = await aesBlock(key, base);
    const chunk = payload.slice(i, i+16);
    for(let j=0;j<chunk.length;j++) out[i+j] = chunk[j] ^ ks[j];
    base[0] = (base[0] + 1) & 0xff;
  }
  return out;
}
async function buildCommandPacket(key, mac, sequence, dest, opcode, params, vendor){
  const seqB = u24le(sequence);
  const nonce = concat(reverseBytes(mac).slice(0,4), Uint8Array.of(0x01), seqB);
  const plain = new Uint8Array(15);
  plain[0] = dest & 0xff; plain[1] = (dest >> 8) & 0xff; plain[2] = opcode;
  plain[3] = vendor[0]; plain[4] = vendor[1];
  plain.set(params.slice(0,10), 5);
  const tag = (await makeChecksum(key, nonce, plain)).slice(0,2);
  return concat(seqB, tag, await cryptPayload(key, nonce, plain));
}

function setStatus(text, kind){
  $("statusText").textContent = text;
  $("status").className = "status" + (kind ? " " + kind : "");
}
function bulbGlow(){
  const t = clamp(state.tone, 0, 100) / 100;
  const warm = [255, 158, 76], cool = [188, 216, 255];
  const c = warm.map((v,i) => Math.round(v + (cool[i] - v) * t));
  const o = state.on === true ? (0.22 + 0.55 * (state.brightness / 100)) : 0.04;
  return [c, o];
}
function render(){
  $("power").classList.toggle("on", state.on === true);
  $("power").disabled = !ready;
  const [c, o] = bulbGlow();
  document.body.style.setProperty("--glowC", c.join(","));
  document.body.style.setProperty("--glowO", o.toFixed(2));
  $("stateText").innerHTML = ready
    ? (state.on ? "<strong>On</strong> · " + state.brightness + "%" : "Off")
    : "Not connected";
  const b = $("brightness"), t = $("tone");
  b.style.setProperty("--p", state.brightness + "%");
  t.style.setProperty("--p", state.tone + "%");
  if(document.activeElement !== b){
    b.value = state.brightness;
    $("brightVal").textContent = state.brightness + "%";
  }
  if(document.activeElement !== t){
    t.value = state.tone;
    $("toneVal").textContent = state.tone;
  }
  b.disabled = !ready;
  t.disabled = !ready;
}
function savePrefs(){
  try{ localStorage.setItem(PREFS_KEY, JSON.stringify({ brightness: state.brightness, tone: state.tone, on: state.on })); }catch(e){}
}
function loadPrefs(){
  try{
    const p = JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
    if(typeof p.brightness === "number") state.brightness = clamp(p.brightness, 1, 100);
    if(typeof p.tone === "number") state.tone = clamp(p.tone, 0, 100);
    if(typeof p.on === "boolean") state.on = p.on;
  }catch(e){}
}

async function sendCmd(opcode, params){
  if(!ready) throw new Error("not connected");
  if(mode === "relay"){
    const id = ++relaySeq;
    const res = await new Promise((resolve, reject) => {
      pendingRelay[id] = { resolve, reject };
      try{
        relayWs.send(JSON.stringify({ type: "command", id, opcode, params: Array.from(params), dest: DEST }));
      }catch(e){
        delete pendingRelay[id];
        reject(e);
        return;
      }
      setTimeout(() => {
        if(pendingRelay[id]){ delete pendingRelay[id]; reject(new Error("timeout")); }
      }, 8000);
    });
    if(res.state) updateStateFromBridge(res.state);
    if($("statusText").textContent === "Command failed") setStatus("Connected", "ok");
    return;
  }
  if(mode === "bridge"){
    let lastErr = null;
    for(let attempt = 0; attempt < 2; attempt++){
      try{
        const r = await fetch(bridgeBase + "/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ opcode, params: Array.from(params), dest: DEST })
        });
        const j = await r.json();
        if(!j.ok) throw new Error(j.error || "command failed");
        if(j.state) updateStateFromBridge(j.state);
        if($("statusText").textContent === "Command failed") setStatus("Connected", "ok");
        return;
      }catch(e){
        lastErr = e;
        await sleep(250);
      }
    }
    throw lastErr || new Error("command failed");
  }
  const packet = await buildCommandPacket(sessionKey, macBytes, seq, DEST, opcode, params, VENDOR);
  seq = (seq + 1) & 0xFFFFFF;
  await chars.command.writeValueWithoutResponse(packet);
}

function makeThrottle(send){
  let timer = null, pending = null, inFlight = false, last = 0;
  async function flush(){
    if(inFlight || pending === null) return;
    const val = pending; pending = null;
    inFlight = true; last = Date.now();
    try{ await send(val); }catch(e){ setStatus("Command failed", "err"); }
    inFlight = false;
    if(pending !== null) queue(pending);
  }
  function queue(v){
    pending = v;
    clearTimeout(timer);
    timer = setTimeout(flush, Math.max(0, 150 - (Date.now() - last)));
  }
  return { queue, flush };
}
const brightThrottle = makeThrottle(async v => {
  state.brightness = clamp(Math.round(v), 1, 100);
  render(); savePrefs();
  await sendCmd(OP.BRIGHT, Uint8Array.of(state.brightness));
});
const toneThrottle = makeThrottle(async v => {
  state.tone = clamp(Math.round(v), 0, 100);
  render(); savePrefs();
  await sendCmd(OP.TONE, Uint8Array.of(5, state.tone));
});

async function togglePower(){
  if(!ready) return;
  const on = !state.on;
  state.on = on;
  render(); savePrefs();
  try{ await sendCmd(OP.POWER, Uint8Array.of(on ? 1 : 0)); }
  catch(e){ state.on = !on; render(); setStatus("Command failed", "err"); }
}

function savedBridge(){
  try{ return localStorage.getItem(BRIDGE_KEY) || ""; }catch(e){ return ""; }
}
function savedPin(){
  try{ return localStorage.getItem(PIN_KEY) || ""; }catch(e){ return ""; }
}
function updateStateFromBridge(js){
  if(!js) return;
  if(typeof js.on === "boolean") state.on = js.on;
  if(typeof js.brightness === "number" && document.activeElement !== $("brightness")) state.brightness = js.brightness;
  if(typeof js.tone === "number" && document.activeElement !== $("tone")) state.tone = js.tone;
  render();
}
async function detectBridge(base){
  try{
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 4000);
    const r = await fetch(base + "/ping", { cache:"no-store", signal: ctrl.signal });
    clearTimeout(t);
    const j = await r.json();
    return j && j.ok ? j : null;
  }catch(e){ return null; }
}
async function bridgeConnect(base){
  const r = await fetch(base + "/connect", { method:"POST", headers:{ "Content-Type":"application/json" }, body:"{}" });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || "connect failed");
  bridgeBase = base;
  mode = "bridge";
  ready = true;
  render();
  clearInterval(bridgeTimer);
  bridgeTimer = setInterval(async () => {
    try{
      const rr = await fetch(bridgeBase + "/state", { cache:"no-store" });
      const js = await rr.json();
      if(typeof js.on === "boolean" && js.on !== state.on){ state.on = js.on; render(); }
      if(typeof js.brightness === "number" && js.brightness !== state.brightness){ updateStateFromBridge(js); }
      if(typeof js.tone === "number" && js.tone !== state.tone){ updateStateFromBridge(js); }
    }catch(e){}
  }, 2000);
}
async function relayConnect(){
  const pin = savedPin();
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  const url = proto + location.host + "/client?pin=" + encodeURIComponent(pin);
  return new Promise((resolve, reject) => {
    let settled = false;
    let ws;
    try{ ws = new WebSocket(url); }catch(e){ reject(e); return; }
    const timer = setTimeout(() => {
      if(!settled){ settled = true; try{ ws.close(); }catch(e){} reject(new Error("relay timeout")); }
    }, 6000);
    ws.onmessage = ev => {
      let d;
      try{ d = JSON.parse(ev.data); }catch(e){ return; }
      if(d.type === "status"){
        if(settled) return;
        settled = true;
        clearTimeout(timer);
        if(d.agent){
          relayWs = ws;
          mode = "relay";
          ready = true;
          render();
          resolve(true);
        } else {
          try{ ws.close(); }catch(e){}
          reject(new Error("pc offline"));
        }
      } else if(d.type === "error"){
        if(!settled){ settled = true; clearTimeout(timer); reject(new Error(d.error || "relay error")); }
        try{ ws.close(); }catch(e){}
      } else if(d.type === "result"){
        const p = pendingRelay[d.id];
        if(p){ delete pendingRelay[d.id]; d.ok ? p.resolve(d) : p.reject(new Error(d.error || "command failed")); }
      }
    };
    ws.onclose = () => {
      if(!settled){ settled = true; clearTimeout(timer); reject(new Error("relay closed")); return; }
      if(mode === "relay" && ready){ ready = false; relayWs = null; render(); setStatus("PC offline", "err"); }
    };
    ws.onerror = () => {};
  });
}

async function connectBT(){
  device = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices:[UUID.service, UUID.fe07] });
  const server = await device.gatt.connect();
  device.addEventListener("gattserverdisconnected", () => { ready = false; render(); setStatus("Disconnected", "err"); });
  const svc = await server.getPrimaryService(UUID.service);
  chars.status = await svc.getCharacteristic(UUID.status);
  chars.command = await svc.getCharacteristic(UUID.command);
  chars.pair = await svc.getCharacteristic(UUID.pair);
  macBytes = Uint8Array.from(MAC.split(":").map(x => parseInt(x,16)));
  const clientRandom = crypto.getRandomValues(new Uint8Array(8));
  await chars.pair.writeValue(await buildPairPacket(NAME, PASS, clientRandom));
  await sleep(80);
  try{ await chars.status.writeValue(Uint8Array.of(1)); }catch(e){}
  let resp = null;
  for(let i=0;i<40 && !resp;i++){
    await sleep(150);
    try{ const v = new Uint8Array(await chars.pair.readValue()); if(v.length) resp = v; }catch(e){}
  }
  if(!resp || resp[0] !== 0x0D) throw new Error("pair failed");
  sessionKey = await deriveSessionKey(NAME, PASS, clientRandom, resp.slice(1,9));
  seq = 0;
  mode = "bt";
  ready = true;
  try{ await chars.status.startNotifications(); }catch(e){}
  render();
}

async function connect(){
  const btn = $("connectBtn");
  btn.hidden = true;
  setStatus("Connecting…", "warn");
  try{
    const isLocal = /^(localhost|127\.0\.0\.1|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
    const bases = [];
    if(isLocal) bases.push(BRIDGE_URL);
    const saved = savedBridge();
    if(saved && !bases.includes(saved)) bases.push(saved);
    let connected = false;
    for(const base of bases){
      if(await detectBridge(base)){
        await bridgeConnect(base);
        connected = true;
        break;
      }
    }
    if(!connected && !isLocal && savedPin()){
      try{
        await relayConnect();
        connected = true;
      }catch(e){
        if((e.message || "").includes("pin")) throw e;
      }
    }
    if(!connected){
      if("bluetooth" in navigator){
        await connectBT();
      } else {
        throw new Error(savedPin() ? "pc offline" : "no bridge configured");
      }
    }
    setStatus("Connected", "ok");
    render();
    try{
      await sendCmd(OP.BRIGHT, Uint8Array.of(state.brightness));
      await sendCmd(OP.TONE, Uint8Array.of(5, state.tone));
    }catch(e){}
  }catch(e){
    ready = false;
    render();
    const msg = (e && e.message) || "";
    const hasBT = ("bluetooth" in navigator);
    let text = "Not reachable";
    if(msg.toLowerCase().includes("cancel")) text = "Cancelled";
    else if(msg.includes("pair failed")) text = "Pair failed";
    else if(msg.includes("pc offline")) text = "PC offline";
    else if(msg.toLowerCase().includes("pin")) text = "Wrong PIN";
    else if(msg.includes("no bridge")) text = "Set PIN in ⚙";
    else if(!hasBT) text = "No Bluetooth in this browser";
    setStatus(text, "err");
    btn.hidden = false;
    btn.textContent = hasBT ? "Reconnect" : "Reconnect (set ⚙)";
  }
}

function init(){
  loadPrefs();
  render();
  $("power").addEventListener("click", togglePower);
  $("brightness").addEventListener("input", e => {
    $("brightVal").textContent = e.target.value + "%";
    brightThrottle.queue(Number(e.target.value));
  });
  $("brightness").addEventListener("change", e => { brightThrottle.flush(); });
  $("tone").addEventListener("input", e => {
    $("toneVal").textContent = e.target.value;
    toneThrottle.queue(Number(e.target.value));
  });
  $("tone").addEventListener("change", e => { toneThrottle.flush(); });
  $("connectBtn").addEventListener("click", connect);
  $("gearBtn").addEventListener("click", () => {
    const row = $("bridgeRow");
    row.hidden = !row.hidden;
    if(!row.hidden){ $("bridgeInput").value = savedBridge(); $("pinInput").value = savedPin(); }
  });
  $("bridgeSave").addEventListener("click", () => {
    const v = $("bridgeInput").value.trim().replace(/\/+$/, "");
    const p = $("pinInput").value.trim();
    try{
      v ? localStorage.setItem(BRIDGE_KEY, v) : localStorage.removeItem(BRIDGE_KEY);
      p ? localStorage.setItem(PIN_KEY, p) : localStorage.removeItem(PIN_KEY);
    }catch(e){}
    $("bridgeRow").hidden = true;
    setStatus(v || p ? "Saved" : "Cleared", "ok");
  });
  const isLocal = /^(localhost|127\.0\.0\.1|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
  if(isLocal || savedBridge() || savedPin()){
    connect();
  } else {
    $("connectBtn").hidden = false;
    $("connectBtn").textContent = "Connect";
    setStatus("Tap Connect", "");
  }
}

if(typeof window !== "undefined") window.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
